<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor</title>

    <link rel="stylesheet" type="text/css" href="simcirjs/simcir.css">
    <script type="text/javascript" src="simcirjs/simcir.js"></script>
    <script type="text/javascript" src="simcirjs/simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="simcirjs/simcir-basicset.css">


    <link rel="stylesheet" type="text/css" href="./style.css">
    <script type="text/javascript" src="./editor.js" defer></script>
    <script type="text/javascript" src="./simcir-extras.js" defer></script>
    <script type="text/javascript" src="./script.js" defer></script>
  </head>
  <body>
    <nav id="toolbar">
      <div class="dropdown">
        <button>Project</button>
        <div class="dropdown-content">
          <button onclick="editor.newProject()">New</button>
          <button onclick="editor.save();">Save</button>
          <button onclick="editor.open();">Open</button>
        </div>
      </div>
      <div class="dropdown">
        <button>Device</button>
        <div class="dropdown-content">
          <button onclick="editor.newDevice();">New</button>
          <button onclick="editor.importDevices();">Import</button>
          <button onclick="editor.editLayout();">Layout</button>
        </div>
      </div>
    </nav>
    <div id="header">
      <span>Devices</span>
      <div id="tabs"></div>
    </div>
    <div id="box">
      <div id="editor"></div>
    </div>
  </body>
</html>
