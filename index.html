<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editor</title>

    <link rel="stylesheet" type="text/css" href="./simcirjs/simcir.css">
    <script type="text/javascript" src="./simcirjs/simcir.js"></script>

    <script type="text/javascript" src="./simcirjs/simcir-basicset.js"></script>
    <link rel="stylesheet" type="text/css" href="./simcirjs/simcir-basicset.css" />

    <link rel="stylesheet" type="text/css" href="./style.css" />
    <script type="text/javascript" src="./script.js" defer></script>
  </head>
  <body>
    <nav id="toolbar">
      <button onclick="editor.flush()">New</button>
      <button onclick="editor.save();">Save</button>
      <button onclick="editor.open();">Open</button>
      <button onclick="editor.importDevice();">Import</button>
    </nav>
    <div id="editor"></div>
  </body>
</html>
